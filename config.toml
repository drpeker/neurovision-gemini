# NeuroVision robot ayarlari. API anahtari burada degil, .env dosyasinda.

[gemini]
model = "gemini-3.8-live"
voice = "Kore"
# Gemini'nin Google aramasi (haber, kur, guncel bilgi). Bu anahtarda kotasi yok (1011 "quota"):
# faturalandirma acilinca true yap. Hava durumu ve Vikipedi bundan bagimsiz calisir.
google_search = false
# Oturum baglami bu kadar tokeni gecince en eskisi atilip hedefe iner (her tur tum baglami isler)
context_trigger_tokens = 16000
context_target_tokens = 8000
# Modele giden metin: düzgün Türkçe yaz (Türkçe karakterlerle)
system_instruction = """
Sen NeuroVision adında, paletli, kameralı ve mikrofonlu bir ev robotusun.
Her zaman Türkçe konuş. Kısa, doğal ve samimi cevaplar ver; genelde bir iki cümle yeterli.
Etrafını görmek için look aracını kullan; görmediğin bir şeyi görmüş gibi anlatma.
Kimseyi yüzünden tanımaya çalışma.
Hafızan var: kullanıcı kalıcı bir bilgi paylaştığında (isim, tercih, aile, eşyaların yeri,
alışkanlık) remember ile kaydet. Geçmişle ilgili bir soru gelirse önce aşağıdaki bilgilere bak,
orada yoksa recall ile ara. "Unut" denirse forget kullan. Hatırlamadığın şeyi uydurma.
Bataryan senin enerjin: oranını gözlerinin rengi de gösterir (mavi, sarı, turuncu, kırmızı). Durumu için
body_status batarya kullan; ölçmeden söyleme. Batarya olayı gelirse kısaca söyle; azaldıkça daha az hareket
etmeye ve şarj istemeye sen karar ver. Kritik seviyede sistem seni kendisi kapatır.
Kalan süreyi kalan_mAh ve ortalama_akım_A ile kendin hesapla, hafızadaki eski sürelere güvenme. Kapasiteden
emin değilsen kullanıcıya sor, battery_capacity ile kaydet.
Önündeki mesafeyi distance ile santimetre olarak ölçebilirsin; sensör dar bir alana bakar, kişi tam karşında değilse başka şeyi ölçer.
Bana gel ya da yaklaş denince şu sırayla ilerle, adımların hepsini yap: 1) look ile bak, görülenler listesinde person ara. Kişi yoksa 45 derece dön, yeniden bak; en fazla bir tur. 2) Kişinin x değeriyle turn_to çağır. 3) Yeniden look; kişi ortada değilse (x 420-580 dışı) turn_to ile düzelt. 4) distance ile ölç; istenen yakınlığa (söylenmediyse 40 cm) kalan yolu hıza bölüp tek move ile git. Hızın normalde saniyede yaklaşık 24 cm, yavaşta 18 cm, hızlıda 30 cm; ilk ve son 0.3 saniyede daha az. 5) Durunca mutlaka yeniden look ve distance ile kontrol et, kalan varsa düzeltip devam et, varınca söyle. Sensör dar bir alana bakar, kişi tam karşında değilse başka şeyi ölçer; ölçüm görüntüyle uyuşmuyorsa önce dön.
Kameran yerden alçakta, bacakların kadrajı doldurması yakınlık değildir: uzaklığa sensörden bak, çekinmeden yaklaş. Robot ileri giderken çok yakın engelde, çarpmada, eğilince ya da kaldırılınca kendisi durur; araç sonucunda ya da sistem olayı olarak bildirilir. Hareket sırasında kullanıcı konuşursa da durursun; sözünü dinle.
Yalnızca araç sonuçlarında ve görüntüde gördüğünü söyle. Yapmadığın hareketi, görmediğin şeyi ya da sebebini bilmediğin durumu uydurma; bilmiyorsan bilmiyorum de.
Kendi bedenini hissedebilirsin: ısın, gücün, işlemcin, belleğin, pinlerin, bağlı sensörlerin,
ortam ışığı ve ses düzeyi için body_status kullan; ölçmeden tahmin yürütme.
Ekranında gözlerin var; söylediğine uygun bir duygu olduğunda express ile yüz ifadeni göster.
Paletlerin var: kullanıcı isterse move ile hareket et, "dur" denirse hemen stop kullan.
Hareket ederken kısa adımlar at; emin değilsen önce look ile önüne bak.
Hareket gerekiyorsa izin bekleme, hemen move çağır.
Hava durumu sorulursa weather kullan; yer söylenmediyse hafızadaki konumu kullan, o da yoksa sor.
Ansiklopedik bir bilgiden emin değilsen wiki ile ara. Sonuçları kısaca, kendi cümlelerinle söyle.
Ses düzeyini volume ile değiştir.
Kendiliğinden bilgi verme: hava durumu, haber gibi şeyleri yalnızca sorulunca söyle.
Bağlantı yeni açıldığında konuşmaya kendin başlama; kullanıcı konuşunca kısaca cevap ver.
Anlamsız, başka dilde ya da bağlamsız kısa ses parçalarına cevap verme; anlamadıysan kısaca sor.
"""

[audio]
# ALSA cihaz adlari (~/.asoundrc): mic = INMP441, speaker = MAX98357A (ikisi de I2S karti)
mic = "mic"
speaker = "speaker"
# "Mic Boost" kontrolunun bulundugu ALSA karti (googlevoicehat-soundcard)
card = "sndrpigooglevoi"
# INMP441 yazilim kazanci (-10..30 dB, ~/.asoundrc "Mic Boost"); konusma tepesi 1.0'a dayanirsa dusur
# GPIO20'ye tasindiktan sonra olculdu: +6 dB'de konusma -30 dBFS, en yuksek tepe -9 dBFS.
# +12 dB konusmayi ~-24'e, tepeyi ~-3'e cikarir; kirpma yok
mic_boost_db = 12
# INMP441'in DC/dusuk frekans kaymasini temizler; filtre, VAD ve modele giden ses icin
highpass_hz = 80
# Robot konusurken mikrofon kapali (AEC yok); konusma bitince bu kadar bekle
echo_tail_ms = 300
# Hoparlor ses duzeyi (%); komutla degisince hafizada saklanir ve bu deger yerine o kullanilir
volume = 100

[vad]
# Acilista ortam bu kadar dinlenir; konusma bu tabanin margin_db ustunde olmali
calibrate_ms = 2000
# 80 Hz filtreli seste, -68 dBFS tabanla: +15 uzak gurultuyu (TV, oda) tamamen eler,
# konusma bolumlerini korur; +8/+12 uzak gurultuyu gecirdi
margin_db = 15
# Bu kadar konusma birikmeden modele hicbir sey gitmez; birikmezse ses atilir
min_speech_ms = 300
# webrtcvad hassasiyeti 0-3; 3 boguk INMP441'de konusmanin ortasini da kesiyor
aggressiveness = 2
preroll_ms = 300
hangover_ms = 800

[camera]
enabled = true
# 640x480: 320x240'te JPEG kaybi yuzunden YOLO kenardaki kisiyi %29 guvenle goruyordu, burada %63
width = 640
height = 480
# OV5647 1 kare/s'de cikti vermiyor. Nesne takibi icin 5 (her donusten sonra yeni kare)
fps = 5
# Kamera montaj acisi, saat yonunde: 0 / 90 / 180 / 270 (90 ve 270 yazilimda dondurulur)
# Robotta kamera bas asagi takili ("Pi4 Fan" yazisiyla dogrulandi): 180 -> rpicam donanimda dondurur.
# 180 derece sag/solu da degistirir; ayarsizken robot sola bakinca saga donuyordu.
rotation = 180
# Yatay ayna (denendi: sag/sol sorununu cozmedi, yazilari okunmaz yapti)
hflip = false
# true: her konusma basinda modele kare gider; false: yalnizca model look ile isteyince
frame_on_speech = false

[display]
# 1.69" ST7789 240x280: panel bellegi 240x320, gorunen alan 20 satir asagida
enabled = true
width = 240
height = 280
y_offset = 20
spi_bus = 0
spi_device = 0
spi_hz = 40000000
dc_pin = 25
rst_pin = 5
backlight_pin = 6
# Arka isik (%): etkilesim varken / bu kadar saniye sessizlikten sonra.
# Su an yalnizca acik/kapali (>0 acik): yazilim PWM'i motor PWM'ini bozuyordu
bright = 100
dim = 25
dim_after_s = 120
# Bu sicakliktan sonra gozler turuncu
hot_c = 75
# Cevap bu kadar saniyede gelmezse "dusunuyor" noktalari kalkar
thinking_timeout_s = 4
# Acilista "Peker / AI Technology" ekrani bu kadar saniye kalir
splash_s = 3
# look ile alinan kare yuzun yerinde bu kadar saniye gorunur (tek kare, canli degil)
preview_s = 3
# Altta altyazi: son soylenen (gri) ve robotun cevabi (beyaz); sessizlikten hold_s sonra silinir
captions = true
caption_lines = 3
caption_font_px = 15
caption_hold_s = 8

[motors]
# MX1508 (EN yok, PWM IN pinlerinde), 2S besleme. Pinler ve yonler testle dogrulandi
# (sol A, sag B kablo ters). L298N'e donulurse driver = "l298n" (en pinleri kullanilir).
enabled = true
driver = "mx1508"
# Hiz duzeyi (%): asagidaki tum hizlari carpar; sesle degisince hafizada saklanir
speed_level = 80
pwm_hz = 200
# Yumusak kalkis/durus: guc ramp_start'tan hedefe ramp_up_ms'de cikar, sonda ramp_down_ms'de iner.
# ramp_start yerde kalkis esiginin hemen alti. Ani akim 2S bataryanin korumasini
# attirabiliyor; kalkis yumusak kalsin. (L298N'de 35 idi; MX1508 ~2 V daha fazla verir)
ramp_start = 22
ramp_up_ms = 300
ramp_down_ms = 200
# Takip darbeleri (kisa, rampasiz yerine kisa rampa): 40 ms'de art arda %40 darbeler
# bataryayi tuketip korumayi attirabildi; 90 ms ani akimi yumusatir, donusu az etkiler
pulse_ramp_ms = 90
# Hiz (%), duzey %100'de: duz / donus / tavan / taban. L298N'deki begenilen hizlarin
# (42/50) MX1508 karsiligi: L298N ~2 V yiyordu, ayni motor gerilimi icin daha az PWM gerekir.
# Tavan: 2S (8.4 V) x %70 ~ 6 V motor siniri. Taban: yerde kalkis esigi (tahmin, testle ayarla)
drive_speed = 42  # ZERO 6 V regule: 2026-10-30
turn_speed = 38
max_speed = 90  # 6 V regule hat: PWM motoru 6 V ustune cikaramaz
min_speed = 22
# Sesli donusun en dusuk gucu (%): 30 ile 0.3-1 sn donus zayifti (yerde %28 ~5 derece/0.25 sn).
# Takip ve arama bunu kullanmaz. Sesli donus ayrica kisa rampa (pulse_ramp_ms) kullanir.
turn_min_speed = 36
max_seconds = 15.0
# En kisa hareket; model "biraz" icin 0.2 sn seciyor
min_seconds = 0.25
reverse_pause_ms = 150
# Motor durduktan sonra mikrofon bu kadar daha kapali (ms)
mute_tail_ms = 400
# Bu sicaklikta ya da dusuk voltajda hiz bu oranla carpilir
hot_c = 75
derate = 0.6
# Duz gidiste yon duzeltmesi (jiroskop): derece basina guc orani ve tavani
steer_per_deg = 0.04
steer_max = 0.3
# Motor donerken konusma bu seviyeyi (dBFS) ve motor gurultusunun 6 dB ustunu gecince robot durur
barge_db = -15
# en: yalnizca L298N'de kullanilir; MX1508'de GPIO12/13 bos
left = { in1 = 23, in2 = 24, en = 12, invert = false }
right = { in1 = 27, in2 = 22, en = 13, invert = true }

[vision]
# Yerel nesne tanima (YOLO11n 320, COCO 80 nesne) ile yalnizca donerek takip
enabled = true
model = "models/yolo11n_320.onnx"
threads = 2
# Model esigi dusuk (fare gibi kucuk nesneler); takip edilecek hedef icin ayri esik
threshold = 0.25
target_threshold = 0.3
# Renkli hedef: kirmizi kutu 1.0, ortamdaki sahte kirmizi bolgeler en fazla 0.4 olculdu
color_threshold = 0.5
# Hedef kadraj ortasina bu kadar yakinsa (genisligin orani) donulmez
center_tolerance = 0.08
# Kameranin yatay gorus acisi (OV5647 ~54 derece): sapma -> donulecek aci
hfov_deg = 56  # ZERO: 10 derecelik adimlarla iki yonde olculdu (2026-10-30): foto 56.4, video 55.8
# Yerde olculdu (MX1508, 2S, 2026-10-27): [guc %, 0.25 sn rampasiz darbede donus derecesi]
# %24'te 3, %40'ta 14 derece; takipte hiz duzeyi ve "yavas" uygulanmaz
turn_table = [[24, 3], [28, 5.5], [32, 8], [36, 11], [40, 14]]
# Buyuk sapmada %40 ile darbe uzar, en fazla bu kadar
pulse_max = 0.6
# Her donusten sonra bu kadar durup dinle ("dur" duyulsun)
listen_s = 0.8
# Hedef bu kadar gorunmezse aranir: son goruldugu yone search_steps kez donulur
lost_s = 2.0
search_steps = 8
search_pulse = 0.5
search_duty = 36
# Takip jiroskopla: Zero'da mikrofon motor donerken kapali, "dur" listen_s/look_s icinde duyulur
pulse_min = 0.15
settle_s = 0.1
# %40'ta donus hizi (sol 81, sag 73 derece/sn; jiroskopsuz takip tahmini); kamera karesi ~bu kadar eski
track_rate_dps = 75
frame_lag_s = 0.05
# Jiroskopla arama: once son goruldugu yone, sonra bu adimlarla en fazla bir tur
# ZERO: 35 derecede hedef adimlarin arasinda kaliyordu (YOLO kenarda baska sey saniyor)
sweep_step_deg = 25
look_s = 0.8
moving_dps = 8
exit_edge = 0.3
# Goruntu farki (0-255) bunun altindaysa robot donmemistir
still_diff = 8
# Kullanici konusurken donus en fazla bu kadar bekler
hold_max_s = 8
# Hedef ortalaninca bu sapmaya kadar donulmez; (kisi degilse) bu kadar gorunmezse aranmaz
lock_tolerance = 0.15
lock_hold_s = 6
# Aramada onde bu kadar yakin engel varsa once geri gidilir
search_obstacle_cm = 35
back_off_cm = 10
back_off_max_s = 1.2
# Kisi takibi: sonarla follow_cm'de bekler, uzaksa ileri (6 V), yakinsa geri, sapma buyukse durup doner
follow_cm = 60
follow_band_cm = 8
follow_duty = 30
follow_duty_per_10cm = 1.0
follow_duty_max = 42
follow_back_duty = 30
follow_far_cm = 200
follow_steer = 0.8
follow_steer_max = 0.35
follow_turn_e = 0.3
follow_box_h = 0.95
follow_hold_s = 0.6
# Takilma: art arda bu kadar darbede donus beklenenin bu oranindan azsa takip durur
stall_pulses = 3
stall_ratio = 0.25
timeout_s = 60
max_timeout_s = 300

[radio]
# Kapali: radyo calarken konusma muzikten guvenilir ayrilamadi (robot takili kaldi)
enabled = false
# Muzik konusmaya gore yuksek kaydedilir: radyo robotun sesine gore bu oranda calar.
# 0.5te mikrofondaki yanki konusmayla ayni seviyedeydi (-26 dBFS): araya girmek zorlasiyor
level = 0.3
# Robot konusurken ya da kullanici konusurken radyo bu orana kisilir
duck = 0.15
# Radyo calarken konusma sayilmasi icin mikrofon, radyonun yankisinin bu kadar ustunde olmali
echo_margin_db = 10

# Istasyon adi = yayin adresi (ffmpeg'in actigi her sey: m3u8, mp3, aac)
[radio.stations]
"Kafa Radyo" = "https://moondigitaledge2.radyotvonline.net/kafaradyo/playlist.m3u8"

[imu]
# MPU6050 (I2C-1, 0x68): robotun yonu ve aciyla donus (nv/imu.py)
enabled = true
bus = 1
# Modul ters takiliysa -1 (sola donus pozitif olmali)
sign = 1
# Olcek hatasi: 360 derecelik donuslerde kamerayla olculdu (2026-10-30), gercek = jiroskop x 1.0125
scale = 1.0125
# Aciyla donus: buyuk acida duty_fast, son derecelerde ve duzeltmede duty; hedefe bu kadar yakinsa
# tamam, en fazla max_corrections kez duzeltilir
duty_fast = 70
duty = 50
slow_below_deg = 30
tolerance_deg = 2
max_corrections = 3
# Durdurma ile tam durus arasi kayma: hiz (derece/sn) x coast_s derece; donuslerde ogrenilir
coast_s = 0.035  # ZERO 6 V: yerde ogrenilen ~0.03-0.04
settle_s = 0.4
max_seconds = 3.0
# Donerken motora guc gidiyor ama stall_s sonra hala bundan yavassa robot takilmistir
stall_s = 0.5
stall_dps = 5

[battery]
# INA219 (I2C-1, 0x40): 3S bataryanin artisinda, step-down'dan once (nv/power.py)
enabled = true
bus = 1
addr = 0x40
# Modul sontu R100 varsayildi: olcum araligi ~3.2 A
shunt_ohm = 0.1
cells = 3
poll_s = 0.25
# Pilin kapasitesi; harcanan akim bundan dusulur
capacity_mah = 2500
# Bostayken oran bu surede voltaja yaklasir; bu voltajda bostayken pil dolu sayilir
blend_s = 3600
full_v = 12.45
# Kalan kapasite, yeniden acilista devam etmek icin
state_file = "data/battery.json"
# Akim bundan azken boşta sayilir: oran voltaja yaklasir, kapasite kaydedilir
idle_a = 0.6
# Oran (%) bu degerlerin altina inince seviye: azaliyor, dusuk, cok dusuk (goz: sari, turuncu, kirmizi)
level_bands = [35, 20, 10]
# Voltaj bunun altinda critical_hold_s sn kalirsa veda edip Pi kapanir (3.5 V/hucre)
critical_v = 10.5
critical_hold_s = 30
# Hucre basina dinlenme voltaji -> oran: LiPo tablosu, bu pil icin olculmedi
curve = [[3.27, 0], [3.61, 5], [3.69, 10], [3.71, 15], [3.73, 20], [3.75, 25], [3.77, 30], [3.79, 35],
         [3.80, 40], [3.82, 45], [3.84, 50], [3.85, 55], [3.87, 60], [3.91, 65], [3.95, 70], [3.98, 75],
         [4.02, 80], [4.08, 85], [4.11, 90], [4.15, 95], [4.20, 100]]

[senses]
# Beden algisi (nv/senses.py): olaylar modele gider, karari o verir
# Modul duzken olculen ivme (g): egim buna gore
gravity = [0.06, -0.01, 0.91]
# Tek ornekte ivme sicramasi (g): 6 V'ta duz giderken 0.87, donerken 2.1 olculdu
bump_g = 1.5
turn_bump_g = 3.0
tilt_deg = 20
# Motor dururken bu donus (derece/sn) ya da ivme sapmasi (g) handle_s surerse tasiniyor sayilir;
# still_s durgunluktan sonra biter
handle_dps = 25
handle_g = 0.12
handle_s = 0.15
still_s = 3
# Bu akim (A) 0.6 sn surerse zorlanma: 6 V'ta yerde en fazla 0.71 A olculdu; sikisma olculmedi
stall_a = 1.0
# Ayni olay en fazla bu aralikla bildirilir
repeat_s = 8

[sonar]
# HC-SR04 (nv/sonar.py): TRIG GPIO4, ECHO GPIO17
enabled = true
trig = 4
echo = 17
max_cm = 400
# Olcumler arasi bekleme (sn): onceki darbenin yankilari sonsun
interval_s = 0.04
# Ileri giderken engel bundan yakinsa robot aninda durur (Motors.Obstacle)
stop_cm = 25

[memory]
# Pi'de yerel SQLite; git disinda
db = "data/memory.db"
# Sohbet bu kadar sustuktan sonra dokum ozetlenir, kalici bilgiler cikarilir ve oturum
# yenilenir (yeni oturum ozet + bilgilerle baslar)
idle_s = 120
summary_model = "gemini-3.5-flash-lite"
# Yeni oturum acilirken modele verilen bilgi ve ozet sayisi
facts_in_prompt = 40
episodes_in_prompt = 5

[body]
# body_status araci: robotun kendi donanim durumu (yalnizca okur)
warn_temp_c = 75
warn_battery_percent = 20
# Taranacak I2C bus'lari; 10/20/21/22 kamera ve HDMI'ya ait, taranmaz
i2c_buses = [1]

# Sistemin kullandigi pinler: durumu degil gorevi raporlanir
[body.reserved_pins]
0 = "HAT EEPROM"
1 = "HAT EEPROM"
2 = "I2C SDA"
3 = "I2C SCL"
14 = "UART TX"
15 = "UART RX"
18 = "I2S BCLK"
19 = "I2S LRCLK"
20 = "I2S mikrofon (INMP441 SD)"
21 = "I2S hoparlör (MAX98357A DIN)"
16 = "amfi SD (ses sürücüsü; amfide boş)"
9 = "SPI MISO"
10 = "SPI MOSI (ekran SDA)"
11 = "SPI SCLK (ekran SCL)"

# Pin planimizdaki gorevler (henuz takili olmayanlar "planlı")
[body.pin_names]
22 = "sağ motor IN4 (MX1508, PWM)"
23 = "sol motor IN1 (MX1508, PWM)"
24 = "sol motor IN2 (MX1508, PWM)"
27 = "sağ motor IN3 (MX1508, PWM)"
25 = "ekran DC"
5 = "ekran RST"
8 = "ekran CS (SPI CE0)"
6 = "ekran arka ışık"
7 = "dokunmatik CS (planlı)"
4 = "HC-SR04 TRIG"
17 = "HC-SR04 ECHO"

[debug]
# Modele giden son konusmalarin sesi ve oturum talimati; bir hatayi yeniden oynatmak icin
enabled = true
dir = "logs/debug"
keep = 10

[log]
file = "logs/robot.log"
level = "INFO"
